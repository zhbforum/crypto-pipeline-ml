name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-sentiment.txt
          python -m pip check

      - name: Lint (prospector)
        run: |
          python -m prospector --version
          python -m prospector src

      - name: Compile & import smoke test
        run: |
          python -m compileall -q src
          python - << 'PY'
          import importlib
          for m in [
              "app.constants","app.timeutil",
              "app.exchange.binance_client",
              "app.sinks.csv_sink",
              "app.services.collector",
              "app.scheduler",
              "app.sinks.kafka_writer",
              "app.analytics.arima_model",
              "app.analytics.fed_rate_anova",
              "app.jobs.kafka_daily_to_s3",
              "app.jobs.s3_monthly_forecast",
              "app.tweets.truth_parser",
              "app.scripts.download_model",
          ]:
              importlib.import_module(m)
          print("Imports OK")
          PY

      - name: Offline regression tests and dashboard smoke test
        run: python -m unittest discover -s tests -v
